<!doctype html><!-- The link-preview image (public/og-image.png), 1200×630: the Welcome headline card over the faded mark. Keep the headline in step with src/scenes/Welcome.tsx, then run: node scripts/og-image.mjs -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#fff;font-family:Assistant,sans-serif}
  .mark{position:absolute;left:50%;top:50%;width:980px;transform:translate(-50%,-50%);opacity:.2}
  .card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1000px;box-sizing:border-box;
    background:#fff;border:1px solid #e6e8ee;border-radius:18px;padding:52px 60px;text-align:center;
    box-shadow:0 1px 2px rgba(10,11,15,.09),0 8px 20px rgba(10,11,15,.105),0 20px 40px rgba(10,11,15,.105)}
  .card img{height:64px;margin-bottom:30px}
  h1{margin:0;font-size:42px;white-space:nowrap;line-height:1.18;font-weight:400;color:#111827;letter-spacing:-.015em}
  h1 strong{font-weight:700}
</style></head><body>
<img class="mark" src="../public/mark.svg">
<div class="card"><img src="../public/logo.png"><h1>AI-powered <strong>financial modeling and analytics</strong><br>engineered for <strong>subscription businesses.</strong></h1></div>
</body></html>
